# Complexity signals. Later entries win when several match.
complexity:
  trivial: [typo, rename this label, change the wording, one line, tiny, trivial]
  small: [add a comment, small change, minor, quick, single file, tweak]
  normal: []
  complex: [across the, multiple, end to end, end-to-end, migrate, redesign, architecture, integrate, whole system, refactor the]
  critical: [production, security, data loss, irreversible, breaking change, all users, compliance, outage]

risk:
  high: [production, delete, drop table, irreversible, destructive, security, credentials, migrate the database, force push, deploy]
  medium: [refactor, migrate, breaking, schema, upgrade the, replace the]

# Goals matching these are planned as read-only and never get a write worktree.
read_only:
  [do not modify, don't modify, read-only, read only, without changing, explain,
   describe, what does, how does, summarize the existing, summarise the existing,
   review, audit, investigate, locate, find where]

# Actions that require a human approval gate before the platform performs them.
approval_signals:
  destructive_actions: [delete, remove all, drop table, wipe, purge, force push, reset --hard, rm -rf]
  deployment: [deploy, release to production, roll out, ship to production]
  publishing: [publish, post to, upload to, submit to]
  external_side_effects: [send email, send the email, notify the team, charge, payment, api call to production]
  production_change: [production database, prod cluster, live environment]

# Goal wording that suggests the shape of the deliverable.
artifacts:
  source_code: [implement, code, function, refactor, endpoint, patch]
  test_result: [test, verify, validate]
  report: [report, analysis, findings, investigate, compare]
  markdown: [document, readme, guide, write up, notes]
  design_spec: [wireframe, design, layout, mockup, component]
  image: [logo, illustration, mood board, diagram]
  dataset: [dataset, export the data, csv]
  benchmark: [benchmark, latency, throughput, profiling]
  plan: [plan, roadmap, requirements, strategy, steps]
  research_notes: [research, sources, literature, prior art]
  spreadsheet: [spreadsheet, table of, matrix of]

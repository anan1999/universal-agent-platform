# Goal-text signals. This file is DATA: the Goal Analyzer contains no keyword
# literals, so new domains are added here (or by a profile's `detection.keywords`)
# without touching Python.
#
# A goal that matches nothing is not an error. It falls back to the general
# profile's capabilities and is still planned and executed.

capabilities:
  repository_search: [locate, find where, where is, search the, explore the, trace, look up]
  coding: [implement, code, write a function, add a method, build the, create the endpoint, port]
  refactor: [refactor, restructure, clean up, extract, rename, simplify the code]
  bug_fix: [bug, broken, crash, regression, fails with, error when, not working, defect]
  debugging: [debug, root cause, stack trace, reproduce, why does it fail, investigate the failure]
  testing: [test, unit test, integration test, coverage, assert, verify the behaviour, verify the behavior]
  build: [build, compile, package, bundle, assemble]
  code_review: [review the code, code review, pull request, merge request, diff review]
  documentation: [document, documentation, readme, changelog, guide, tutorial, api reference, write up]
  writing: [write, draft, rewrite, summarize, summarise, article, post, copy]
  editing: [edit, proofread, tighten, polish the wording]
  requirements: [requirements, spec, specification, prd, scope, acceptance criteria]
  user_story: [user story, as a user, epic, backlog item]
  prioritization: [prioritize, prioritise, rank, roadmap, sequence the work]
  competitive_analysis: [competitor, competitive, market comparison, alternatives to]
  research: [research, investigate, survey, literature, state of the art, prior art, explore options]
  source_discovery: [find sources, references, citations, papers, studies]

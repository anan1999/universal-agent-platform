  synthesis: [synthesize, synthesise, summarize findings, consolidate, bring together]
  comparison: [compare, versus, trade-off, tradeoff, pros and cons, evaluate options]
  user_flow: [user flow, user journey, onboarding flow, navigation flow, screen flow]
  information_architecture: [information architecture, sitemap, navigation, hierarchy, taxonomy]
  wireframing: [wireframe, mockup, layout the, screen design, prototype the]
  usability: [usability, confusing, hard to use, friction, user testing]
  accessibility: [accessibility, a11y, wcag, screen reader, contrast ratio, keyboard navigation]
  design_system: [design system, component library, tokens, style guide]
  visual_direction: [visual direction, look and feel, aesthetic, mood board, art direction]
  typography: [typography, typeface, font, type scale]
  branding: [brand, logo, identity, brand guidelines]
  color: [color palette, colour palette, color scheme, colour scheme]
  visual_review: [design review, visual review, critique the design]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent-platform"
version = "2.3.1"
description = "Universal Agent Platform: bring your goal, bring your AI, the platform builds the team"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai-agents", "multi-agent", "orchestration", "provider-agnostic", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/anan1999/universal-agent-platform"
Repository = "https://github.com/anan1999/universal-agent-platform"
Issues = "https://github.com/anan1999/universal-agent-platform/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1", "Pillow>=10"]

[project.scripts]
agentctl = "adaptive_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_agent = [
    "resources/config/*.yaml",
    "resources/config/profiles/*.yaml",
    "resources/templates/*.yaml",
    "resources/templates/*.md",
    "resources/skills/*/*.json",
    "resources/skills/*/*.md",
    "resources/skills/*/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
